<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CodeLens — Python Static Analysis</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrap">
    <header>
      <h1>🔍 CodeLens</h1>
      <p class="tagline">Upload a Python project (.zip) — get code-quality and hardcoded-secret findings in seconds.</p>
    </header>

    <section id="upload-section" class="card">
      <div id="dropzone" class="dropzone">
        <p><strong>Drag & drop a .zip</strong> of your project here, or click to choose a file.</p>
        <p class="hint">Max 20&nbsp;MB · nothing is stored — analyzed in memory and discarded</p>
        <input type="file" id="file-input" accept=".zip" hidden />
      </div>
      <div id="file-name" class="file-name"></div>
      <button id="scan-btn" disabled>Scan project</button>
      <div id="error-box" class="error-box" hidden></div>
    </section>

    <section id="loading" class="card" hidden>
      <div class="spinner"></div>
      <p>Scanning your project…</p>
    </section>

    <section id="results" hidden>
      <div id="summary-card" class="card"></div>

      <div class="tabs">
        <button class="tab-btn active" data-tab="security">Security</button>
        <button class="tab-btn" data-tab="quality">Code Quality</button>
        <button class="tab-btn" data-tab="errors">Parse Errors</button>
      </div>

      <div id="tab-security" class="tab-content card"></div>
      <div id="tab-quality" class="tab-content card" hidden></div>
      <div id="tab-errors" class="tab-content card" hidden></div>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
